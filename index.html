<title>3D Scan — Независимый диагностический центр</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          // Clean medical light palette
          ink:    '#0F2942',     // deep navy (primary text/dark accent)
          ink2:   '#163A5C',
          mute:   '#5C6B7E',     // muted body
          mute2:  '#8E97A4',     // softer
          paper:  '#FFFFFF',     // pure white
          paper2: '#F4F8FB',     // soft blue-tinted card
          paper3: '#E7EFF5',     // deeper soft blue
          line:   '#E0E8EE',     // hairline
          line2:  '#CCD6DE',
          // Brand accent — medical cyan-blue from logo
          brand:  '#3DBEEB',
          brand2: '#28A8D4',
          brand3: '#1F8FB8',
          brandsoft:'#DCF1FA',   // pale tint
          // Doctor accent — deeper trustworthy navy-blue
          deep:   '#235D8C',
          deepsoft:'#DCE7F0',
        },
        fontFamily: {
          sans:   ['Geist','ui-sans-serif','system-ui','sans-serif'],
          serif:  ['Fraunces','ui-serif','Georgia','serif'],
        },
        letterSpacing: { tightish:'-0.015em', tighter2:'-0.03em', looser:'0.02em' },
      }
    }
  }
</script>

<style>
  html,body{ background:#FFFFFF; color:#0F2942; }
  body{ font-family:Geist,'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  ::selection{ background:#DCF1FA; color:#0F2942; }

  .font-display{ font-family:Fraunces,Georgia,serif; font-optical-sizing:auto; font-variation-settings:"opsz" 144,"SOFT" 50; letter-spacing:-0.02em; }

  /* Smooth scroll */
  html{ scroll-behavior: smooth; }

  /* Scroll-reveal — enhanced easing */
  .reveal{ opacity:0; transform: translateY(22px); transition: opacity .75s cubic-bezier(.22,1,.36,1), transform .75s cubic-bezier(.22,1,.36,1); }
  .reveal.in{ opacity:1; transform:none; }

  /* Directional reveal variants */
  .reveal-left{ opacity:0; transform: translateX(-28px); transition: opacity .75s cubic-bezier(.22,1,.36,1), transform .75s cubic-bezier(.22,1,.36,1); }
  .reveal-left.in{ opacity:1; transform:none; }
  .reveal-right{ opacity:0; transform: translateX(28px); transition: opacity .75s cubic-bezier(.22,1,.36,1), transform .75s cubic-bezier(.22,1,.36,1); }
  .reveal-right.in{ opacity:1; transform:none; }

  /* Stagger: children animate in sequence when parent gets .in */
  .reveal-stagger > *{ opacity:0; transform:translateY(18px); transition:opacity .65s cubic-bezier(.22,1,.36,1), transform .65s cubic-bezier(.22,1,.36,1); }
  .reveal-stagger.in > *:nth-child(1){ opacity:1; transform:none; transition-delay:0s; }
  .reveal-stagger.in > *:nth-child(2){ opacity:1; transform:none; transition-delay:.09s; }
  .reveal-stagger.in > *:nth-child(3){ opacity:1; transform:none; transition-delay:.18s; }
  .reveal-stagger.in > *:nth-child(4){ opacity:1; transform:none; transition-delay:.27s; }
  .reveal-stagger.in > *:nth-child(5){ opacity:1; transform:none; transition-delay:.36s; }
  .reveal-stagger.in > *:nth-child(6){ opacity:1; transform:none; transition-delay:.45s; }

  /* Hero entrance — plays on mount for above-fold content */
  @keyframes heroFadeUp{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
  .hanim-1{ animation: heroFadeUp .85s cubic-bezier(.22,1,.36,1) both; }
  .hanim-2{ animation: heroFadeUp .85s cubic-bezier(.22,1,.36,1) .1s both; }
  .hanim-3{ animation: heroFadeUp .85s cubic-bezier(.22,1,.36,1) .22s both; }
  .hanim-4{ animation: heroFadeUp .85s cubic-bezier(.22,1,.36,1) .35s both; }
  .hanim-5{ animation: heroFadeUp .85s cubic-bezier(.22,1,.36,1) .48s both; }

  /* Soft hairline divider */
  .hairline{ background-image: linear-gradient(to right, transparent, #CCD6DE, transparent); height:1px; }

  /* Subtle paper grain — disabled */
  .grain{ background:transparent; }

  /* Diagonal stripe placeholder for imagery */
  .stripes{
    background-image: repeating-linear-gradient(
      135deg,
      rgba(15,41,66,0.05) 0 1px,
      transparent 1px 18px
    );
  }

  /* Pulse dot */
  @keyframes pulseDot { 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
  .pulse-dot{ animation: pulseDot 2s ease-in-out infinite; }

  /* Soft focus */
  a, button{ outline-offset:3px; }
  a:focus-visible, button:focus-visible{ outline: 1.5px solid #3DBEEB; border-radius: 2px; }
</style>
